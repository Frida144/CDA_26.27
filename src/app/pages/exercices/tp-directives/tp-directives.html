<div class="row mx-5">
  <div class="col-xs-12">
    <h1 class="text-center">TP Directives</h1>
    <!-- <label>Nom de l'utilisateur</label>

    <!-- TP DIRECTIVES -->
    <div class="d-grid gap-2">
      <!-- <button (click)="afficherText = !afficherText" type="button" name="" id="" class="btn btn-primary">Afficher Détails</button> -->

      <!-- Click sur btn pour boolean à son inverse et un push dans tableau  -->
      <button (click)="onAfficherText()" type="button" name="" id="" class="btn btn-primary">
        {{afficherText===true ?'Masquer Détails':'Afficher Détails'}}
      </button>
    </div>
    <!-- NGIF pour affichage ou non du <p> -->
    <!-- <p *ngIf="afficherText">Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure cumque, eligendi, ducimus eius
      aut explicabo quo cupiditate architecto maiores necessitatibus molestiae voluptatem perferendis laborum, esse
      corporis qui non quae rem!</p> -->

      @if (afficherText) {
      <p >Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure cumque, eligendi, ducimus eius
      aut explicabo quo cupiditate architecto maiores necessitatibus molestiae voluptatem perferendis laborum, esse
      corporis qui non quae rem!</p>
      }


    <!-- NgFor pour la répétition + ngStyle et NgClass -->
    <div *ngFor="let unItemduTab of tabLog" [ngStyle]="{backgroundColor:unItemduTab>=5?'aquamarine':'transparent'}"
      [ngClass]="{'textWhite':unItemduTab>=5}">
      {{unItemduTab}}
    </div>

    <!-- ou avec le index du ngfor Bonus avec l'index du ngFor -->
    <!-- <div *ngFor="let unItemduTab of tabLog; let i=index"
       [ngStyle]="{backgroundColor:i>=4?'aquamarine':'transparent'}"
       [ngClass]="{'textWhite':i>=4}">
       {{unItemduTab}} - {{i}}
      </div> -->
  </div>
</div>

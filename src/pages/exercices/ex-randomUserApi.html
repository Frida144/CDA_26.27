<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Random User Card</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="flex justify-center items-center min-h-screen bg-base-300">

  <div class="card bg-base-200 w-80 shadow-xl">
    <figure class="pt-6">
      <img id="userPhoto" src="https://via.placeholder.com/150" alt="Photo de profil" class="rounded-full w-32 h-32 object-cover" />
    </figure>
    <div class="card-body items-center text-center">
      <h2 id="userName" class="card-title">Chargement...</h2>
      <p id="userEmail" class="text-sm"></p>
      <p id="userAddress" class="text-sm"></p>
      <p id="userPhone" class="text-sm"></p>

      <div class="card-actions mt-4">
        <button id="btnRandom" class="btn btn-primary">Random User</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/exercices/ex-randomUserApi.js"></script>
</body>
</html>
